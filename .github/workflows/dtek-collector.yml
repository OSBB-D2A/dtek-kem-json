name: DTEK — збір даних про відключення

on:
  workflow_dispatch:
  # Увімкніть після успішного ручного тесту:
  # schedule:
  #   - cron: "17 */2 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Collect DTEK outage data
        env:
          DTEK_URL: https://www.dtek-kem.com.ua/ua/shutdowns
          DTEK_STREET: вул. Донця Михайла
          DTEK_BUILDING: 2A
          DTEK_MAX_ATTEMPTS: "3"
        run: python collector.py
      - name: Upload collected data and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtek-kem-data
          path: output/
          if-no-files-found: warn
          retention-days: 14
