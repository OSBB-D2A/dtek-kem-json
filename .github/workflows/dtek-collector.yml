name: DTEK — збір даних про відключення

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          /usr/bin/time -f 'TIMING: встановлення Python-залежностей: %e с' pip install -r requirements.txt
      - name: Install Chromium for Playwright
        run: |
          /usr/bin/time -f 'TIMING: встановлення Chromium та системних залежностей: %e с' python -m playwright install --with-deps chromium
      - name: Collect DTEK outage data
        env:
          DTEK_URL: https://www.dtek-kem.com.ua/ua/shutdowns
          DTEK_STREET: вул. Донця Михайла
          DTEK_BUILDING: 2A
          DTEK_MAX_ATTEMPTS: "3"
        run: python collector.py
      - name: Upload collected data and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtek-kem-data
          path: output/
          if-no-files-found: warn
          retention-days: 14

      # Publish only after a successful collection. Source code, workflow, and
      # published JSON all live on main. Force-add JSON because output/ is ignored
      # by .gitignore; avoid checking out another branch while output files change.
      - name: Prepare combined JSON
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          trap 'echo "TIMING: підготовка об’єднаного JSON: ${SECONDS} с"' EXIT
          python - <<'PY'
          import json
          from pathlib import Path

          out = Path("output")
          response = json.loads((out / "dtek-response.json").read_text(encoding="utf-8"))
          street = json.loads((out / "dtek-street.json").read_text(encoding="utf-8"))
          building = json.loads((out / "dtek-2a.json").read_text(encoding="utf-8"))

          # Remove volatile fetch time from the compact endpoint so unchanged
          # source data does not trigger a commit every five minutes.
          street.pop("checked_at_utc", None)
          building.pop("checked_at_utc", None)

          combined = {
              "source": "DTEK Kyiv Electricity Networks",
              "source_url": building.get("source_url"),
              "updateTimestamp": response.get("updateTimestamp"),
              "street": street,
              "building_2a": building,
              "full_response": response,
          }
          (out / "dtek.json").write_text(
              json.dumps(combined, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (out / "dtek-street.json").write_text(
              json.dumps(street, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (out / "dtek-2a.json").write_text(
              json.dumps(building, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish JSON to main
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          trap 'echo "TIMING: публікація JSON у main: ${SECONDS} с"' EXIT

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Do not switch branches: collector.py has just written output/*.json.
          # Publishing on main avoids checkout conflicts and keeps one branch.
          git add -f output/dtek-response.json output/dtek-street.json output/dtek-2a.json output/dtek.json
          if git diff --cached --quiet; then
            echo "Опубліковані дані не змінилися — новий коміт не створюємо."
            exit 0
          fi

          git commit -m "Update published DTEK data"
          git push origin main
