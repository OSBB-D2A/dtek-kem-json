name: DTEK — збір даних про відключення

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Collect DTEK outage data
        env:
          DTEK_URL: https://www.dtek-kem.com.ua/ua/shutdowns
          DTEK_STREET: вул. Донця Михайла
          DTEK_BUILDING: 2A
          DTEK_MAX_ATTEMPTS: "3"
        run: python collector.py
      - name: Upload collected data and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtek-kem-data
          path: output/
          if-no-files-found: warn
          retention-days: 14

      # Publish only after a successful collection. Data lives on a separate
      # branch, not main. Force-add JSON because output/ is intentionally ignored
      # by the repository's .gitignore on the data branch.
      - name: Prepare combined JSON
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          out = Path("output")
          response = json.loads((out / "dtek-response.json").read_text(encoding="utf-8"))
          street = json.loads((out / "dtek-street.json").read_text(encoding="utf-8"))
          building = json.loads((out / "dtek-2a.json").read_text(encoding="utf-8"))

          # Remove volatile fetch time from the compact endpoint so unchanged
          # source data does not trigger a commit every five minutes.
          street.pop("checked_at_utc", None)
          building.pop("checked_at_utc", None)

          combined = {
              "source": "DTEK Kyiv Electricity Networks",
              "source_url": building.get("source_url"),
              "updateTimestamp": response.get("updateTimestamp"),
              "street": street,
              "building_2a": building,
              "full_response": response,
          }
          (out / "dtek.json").write_text(
              json.dumps(combined, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (out / "dtek-street.json").write_text(
              json.dumps(street, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (out / "dtek-2a.json").write_text(
              json.dumps(building, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish JSON to data branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/dtek-publish
          cp output/dtek-response.json output/dtek-street.json output/dtek-2a.json output/dtek.json /tmp/dtek-publish/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin data
          git checkout data

          mkdir -p output
          cp /tmp/dtek-publish/dtek-response.json /tmp/dtek-publish/dtek-street.json /tmp/dtek-publish/dtek-2a.json /tmp/dtek-publish/dtek.json output/

          git add -f output/dtek-response.json output/dtek-street.json output/dtek-2a.json output/dtek.json
          if git diff --cached --quiet; then
            echo "Опубліковані дані не змінилися — новий коміт не створюємо."
            exit 0
          fi

          git commit -m "Update published DTEK data"
          git push origin data
