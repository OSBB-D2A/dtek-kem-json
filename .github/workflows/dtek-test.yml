name: DTEK JSON test

on:
  workflow_dispatch:
  # Увімкніть після успішного ручного тесту:
  # schedule:
  #   - cron: "17 */2 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect test JSON
        env:
          DTEK_URL: https://www.dtek-kem.com.ua/ua/shutdowns
          DTEK_STREET: вул. Донця Михайла
        run: python collector.py
      - name: Upload output even if collection fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtek-json-test
          path: output/
          if-no-files-found: warn
          retention-days: 14
